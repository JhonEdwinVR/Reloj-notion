<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flip Clock</title>

<!-- PWA -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" href="./icon-192.png">

<!-- Styles -->
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<!-- Screen-reader live region: announces clock/timer state in plain language.
     The visual clock-shell below is aria-hidden, so this is the only thing
     assistive technology will read. -->
<div id="srAnnouncer" class="sr-only" aria-live="polite" role="status"></div>

<!-- Timer setup (fixed overlay, outside shell) -->
<div class="timer-setup" id="timerSetup">
  <div class="timer-setup-title">Configurar Temporizador</div>
  <div class="timer-inputs">
    <div class="timer-input-group">
      <input type="number" id="inputH" min="0" max="23" value="0" aria-label="Horas">
      <label for="inputH">horas</label>
    </div>
    <div class="timer-sep-dot">:</div>
    <div class="timer-input-group">
      <input type="number" id="inputM" min="0" max="59" value="5" aria-label="Minutos">
      <label for="inputM">min</label>
    </div>
    <div class="timer-sep-dot">:</div>
    <div class="timer-input-group">
      <input type="number" id="inputS" min="0" max="59" value="0" aria-label="Segundos">
      <label for="inputS">seg</label>
    </div>
  </div>
  <div class="preset-row" id="presetRow">
    <button class="preset-btn" data-sec="60">1 min</button>
    <button class="preset-btn" data-sec="300">5 min</button>
    <button class="preset-btn" data-sec="600">10 min</button>
    <button class="preset-btn" data-sec="1500">25 min</button>
    <button class="preset-btn" data-sec="1800">30 min</button>
    <button class="preset-btn" data-sec="2700">45 min</button>
    <button class="preset-btn" data-sec="3600">60 min</button>
  </div>
  <div class="timer-setup-btns">
    <button class="act-btn" id="setupCancelBtn">Cancelar</button>
    <button class="act-btn primary" id="setupStartBtn">Iniciar</button>
  </div>
</div>

<!-- Settings panel -->
<div class="settings-panel" id="settingsPanel">
  <div class="settings-title">Configuración</div>

  <div class="settings-row">
    <label for="scaleSlider">Tamaño <span id="scaleLabel">100%</span></label>
    <input type="range" class="scale-slider" id="scaleSlider" min="60" max="200" value="100" step="5">
  </div>

  <div class="settings-row">
    <label>Estilo</label>
    <div class="seg-row" id="styleRow">
      <button class="seg-btn" data-val="classic">Classic</button>
      <button class="seg-btn" data-val="airport">Airport</button>
      <button class="seg-btn" data-val="mechanical">Mech</button>
      <button class="seg-btn" data-val="ultra">Ultra</button>
    </div>
  </div>

  <div class="settings-row">
    <label>Velocidad Flip</label>
    <div class="seg-row" id="speedRow">
      <button class="seg-btn" data-val="slow">Lenta</button>
      <button class="seg-btn" data-val="normal">Normal</button>
      <button class="seg-btn" data-val="fast">Rápida</button>
    </div>
  </div>

  <div class="settings-row">
    <label>Mostrar segundos</label>
    <div class="seg-row" id="secondsRow">
      <button class="seg-btn" data-val="on">ON</button>
      <button class="seg-btn" data-val="off">OFF</button>
    </div>
  </div>

  <div class="settings-row">
    <label>Sonidos</label>
    <div class="seg-row" id="soundsRow">
      <button class="seg-btn" data-val="on">ON</button>
      <button class="seg-btn" data-val="off">OFF</button>
    </div>
  </div>

  <div class="settings-row">
    <label>Formato</label>
    <div class="seg-row" id="formatRow">
      <button class="seg-btn" data-val="12">12h</button>
      <button class="seg-btn" data-val="24">24h</button>
    </div>
  </div>
</div>

<!-- Entry animation wrapper -->
<div class="entry-wrap">
<!-- Main clock shell (no background/border) -->
<div class="clock-shell" id="shell" data-style="classic" aria-hidden="true">

  <!-- Mode label -->
  <div class="mode-label" id="modeLabel">RELOJ</div>

  <!-- Digits -->
  <div class="digits-row">
    <div class="pair" id="pair-0">
      <!-- Card s0 -->
      <div class="card" id="card-s0">
        <div class="ampm" id="ampm">AM</div>
        <div class="half up"   id="su-s0"><span class="digit">0</span></div>
        <div class="half down" id="sd-s0"><span class="digit">0</span><div class="cast-shade" id="cs-s0"></div></div>
        <div class="flap-wrap up"   id="fw-u-s0"><div class="flap" id="fu-s0"><span class="digit">0</span><div class="flap-shade" id="fs-fu-s0"></div></div></div>
        <div class="flap-wrap down" id="fw-d-s0"><div class="flap" id="fd-s0"><span class="digit">0</span><div class="flap-shade" id="fs-fd-s0"></div></div></div>
        <div class="divider"></div>
      </div>
      <!-- Card s1 -->
      <div class="card" id="card-s1">
        <div class="half up"   id="su-s1"><span class="digit">0</span></div>
        <div class="half down" id="sd-s1"><span class="digit">0</span><div class="cast-shade" id="cs-s1"></div></div>
        <div class="flap-wrap up"   id="fw-u-s1"><div class="flap" id="fu-s1"><span class="digit">0</span><div class="flap-shade" id="fs-fu-s1"></div></div></div>
        <div class="flap-wrap down" id="fw-d-s1"><div class="flap" id="fd-s1"><span class="digit">0</span><div class="flap-shade" id="fs-fd-s1"></div></div></div>
        <div class="divider"></div>
      </div>
    </div>

    <div class="sep" id="sep1"><span></span><span></span></div>

    <div class="pair" id="pair-1">
      <!-- Card s2 -->
      <div class="card" id="card-s2">
        <div class="half up"   id="su-s2"><span class="digit">0</span></div>
        <div class="half down" id="sd-s2"><span class="digit">0</span><div class="cast-shade" id="cs-s2"></div></div>
        <div class="flap-wrap up"   id="fw-u-s2"><div class="flap" id="fu-s2"><span class="digit">0</span><div class="flap-shade" id="fs-fu-s2"></div></div></div>
        <div class="flap-wrap down" id="fw-d-s2"><div class="flap" id="fd-s2"><span class="digit">0</span><div class="flap-shade" id="fs-fd-s2"></div></div></div>
        <div class="divider"></div>
      </div>
      <!-- Card s3 -->
      <div class="card" id="card-s3">
        <div class="half up"   id="su-s3"><span class="digit">0</span></div>
        <div class="half down" id="sd-s3"><span class="digit">0</span><div class="cast-shade" id="cs-s3"></div></div>
        <div class="flap-wrap up"   id="fw-u-s3"><div class="flap" id="fu-s3"><span class="digit">0</span><div class="flap-shade" id="fs-fu-s3"></div></div></div>
        <div class="flap-wrap down" id="fw-d-s3"><div class="flap" id="fd-s3"><span class="digit">0</span><div class="flap-shade" id="fs-fd-s3"></div></div></div>
        <div class="divider"></div>
      </div>
    </div>

    <div class="sep" id="sep2"><span></span><span></span></div>

    <div class="pair" id="pair-2">
      <!-- Card s4 -->
      <div class="card" id="card-s4">
        <div class="half up"   id="su-s4"><span class="digit">0</span></div>
        <div class="half down" id="sd-s4"><span class="digit">0</span><div class="cast-shade" id="cs-s4"></div></div>
        <div class="flap-wrap up"   id="fw-u-s4"><div class="flap" id="fu-s4"><span class="digit">0</span><div class="flap-shade" id="fs-fu-s4"></div></div></div>
        <div class="flap-wrap down" id="fw-d-s4"><div class="flap" id="fd-s4"><span class="digit">0</span><div class="flap-shade" id="fs-fd-s4"></div></div></div>
        <div class="divider"></div>
      </div>
      <!-- Card s5 -->
      <div class="card" id="card-s5">
        <div class="half up"   id="su-s5"><span class="digit">0</span></div>
        <div class="half down" id="sd-s5"><span class="digit">0</span><div class="cast-shade" id="cs-s5"></div></div>
        <div class="flap-wrap up"   id="fw-u-s5"><div class="flap" id="fu-s5"><span class="digit">0</span><div class="flap-shade" id="fs-fu-s5"></div></div></div>
        <div class="flap-wrap down" id="fw-d-s5"><div class="flap" id="fd-s5"><span class="digit">0</span><div class="flap-shade" id="fs-fd-s5"></div></div></div>
        <div class="divider"></div>
      </div>
    </div>
  </div>

  <!-- Action bar -->
  <div class="action-bar" id="actionBar">
    <button class="act-btn primary" id="actionMainBtn">Iniciar</button>
    <button class="act-btn" id="actionSkipBtn">Saltar</button>
    <button class="act-btn" id="actionResetBtn">Reiniciar</button>
  </div>

  <!-- Controls bar -->
  <div class="controls-bar">
    <button class="ctrl-btn active" id="btnClock" title="Reloj">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <polyline points="12 6 12 12 16 14"/>
      </svg>
    </button>
    <button class="ctrl-btn" id="btnTimer" title="Temporizador">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 2h4M12 2v2M19.07 4.93l-1.41 1.41M12 4a8 8 0 1 1 0 16A8 8 0 0 1 12 4z"/>
        <polyline points="12 8 12 13 15 15"/>
      </svg>
    </button>
    <button class="ctrl-btn" id="btnStopwatch" title="Cronómetro">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="13" r="8"/>
        <path d="M12 5V2M10 2h4"/>
        <line x1="12" y1="9" x2="12" y2="13"/>
        <line x1="15" y1="10" x2="12" y2="13"/>
      </svg>
    </button>
    <button class="ctrl-btn" id="btnPomodoro" title="Pomodoro">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="13" r="8"/>
        <path d="M9.5 3.5c1-1.2 4-1.2 5 0M12 5.5V3"/>
      </svg>
    </button>
    <button class="ctrl-btn" id="btnSettings" title="Configuración">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
    <button class="ctrl-btn" id="btnFullscreen" title="Pantalla completa">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="fsIcon">
        <path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"/>
      </svg>
    </button>
  </div>

</div><!-- .clock-shell -->
</div><!-- .entry-wrap -->

<script src="./script.js" defer></script>
</body>
</html>
