<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flip Clock</title>
<style>
/* ── Reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html {
  width: 100%; height: 100%;
  background: transparent !important;
  color-scheme: dark light;
}

body {
  width: 100%; height: 100%;
  min-height: 100vh;
  background: transparent !important;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: 'Arial Black', 'Helvetica Neue', Arial, sans-serif;
  overflow: hidden;
  padding: 20px;
  box-sizing: border-box;
}

/* ── Entry animation wrapper (independent of user scale) ── */
.entry-wrap {
  opacity: 0;
  transform: scale(0.95);
  animation: entryIn 600ms cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
}
@keyframes entryIn {
  to { opacity: 1; transform: scale(1); }
}

/* ── Clock wrapper: transparent, no outer shell ── */
.clock-shell {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: transparent;
  padding: clamp(10px, 2vmin, 20px) clamp(12px, 2.5vmin, 24px);
  gap: clamp(8px, 2vmin, 16px);
  user-select: none;
  position: relative;
  transform-origin: center center;
  transform: scale(var(--clock-scale, 1));
  transition: transform 0.25s cubic-bezier(0.22, 0.61, 0.36, 1);
}

/* ── Digits row ── */
.digits-row {
  display: inline-flex;
  align-items: center;
  gap: clamp(10px, 2.5vmin, 24px);
}

/* ── Separador de puntos ── */
.sep {
  display: flex; flex-direction: column;
  gap: clamp(6px, 1.5vmin, 14px);
  align-items: center;
  padding-bottom: 4px;
}
.sep span {
  display: block;
  width: clamp(5px, 0.9vmin, 8px);
  height: clamp(5px, 0.9vmin, 8px);
  border-radius: 50%;
  background: #383838;
  transition: background 0.3s;
}
.sep.blinking span { animation: blink 1s step-start infinite; }
@keyframes blink { 0%,100%{background:#555} 50%{background:#1a1a1a} }

/* ── Par de dígitos ── */
.pair { display: flex; gap: clamp(6px, 1.4vmin, 12px); }

/* ── Tarjeta individual — premium depth, perspectiva real ── */
.card {
  position: relative;
  width:  clamp(54px, 11vmin, 120px);
  height: clamp(76px, 15vmin,  162px);
  background: #111;
  border-radius: clamp(8px, 1.4vmin, 18px);
  overflow: hidden;
  box-shadow:
    0 30px 80px rgba(0,0,0,0.8),
    0 6px 18px rgba(0,0,0,0.7),
    inset 0 1px 0 rgba(255,255,255,0.05),
    inset 0 -1px 0 rgba(0,0,0,0.6);
  perspective: 2000px;
  perspective-origin: center center;
  transition: border-radius 0.3s, box-shadow 0.3s;
}

/* ── Mitades estáticas ── */
.half {
  position: absolute; left: 0; width: 100%; height: 50%;
  overflow: hidden;
  display: flex; justify-content: center;
  z-index: 1;
}
.half.up {
  top: 0;
  align-items: flex-end;
  background: linear-gradient(180deg, #191919, #111);
}
.half.down {
  bottom: 0;
  align-items: flex-start;
  background: linear-gradient(180deg, #0c0c0c, #141414);
}

/* ── Flap wrapper: contexto 3D ── */
.flap-wrap {
  position: absolute; left: 0; width: 100%; height: 50%;
  z-index: 2;
  overflow: hidden;
}
.flap-wrap.up   { top: 0; }
.flap-wrap.down { bottom: 0; }

/* ── La hoja que gira ── */
.flap {
  position: absolute; left: 0; width: 100%; height: 100%;
  display: flex; justify-content: center;
  transform-style: preserve-3d;
  backface-visibility: hidden;
  will-change: transform;
}
.flap-wrap.up   .flap {
  align-items: flex-end;
  background: linear-gradient(180deg, #191919, #111);
  transform-origin: bottom center;
}
.flap-wrap.down .flap {
  align-items: flex-start;
  background: linear-gradient(180deg, #0c0c0c, #141414);
  transform-origin: top center;
}

/* ── Overlay de sombra sobre el flap / mitad ── */
.flap-shade {
  position: absolute; inset: 0;
  background: transparent;
  z-index: 4;
  pointer-events: none;
  backface-visibility: hidden;
}
/* Sombra proyectada estática (sobre la mitad inferior, fuera del flap) */
.cast-shade {
  position: absolute; inset: 0;
  background: transparent;
  z-index: 3;
  pointer-events: none;
}

/* ── Números: profundidad tipográfica ── */
.digit {
  font-size: clamp(42px, 9.2vmin, 100px);
  font-weight: 900;
  color: #fff;
  line-height: 1;
  letter-spacing: -0.02em;
  text-shadow:
    0 1px 0 rgba(255,255,255,0.03),
    0 2px 4px rgba(0,0,0,0.8),
    0 8px 16px rgba(0,0,0,0.5);
  position: relative;
  backface-visibility: hidden;
  transition: font-family 0.2s, letter-spacing 0.2s;
}
.half.up   .digit,
.flap-wrap.up   .flap .digit { transform: translateY(50%); }
.half.down .digit,
.flap-wrap.down .flap .digit { transform: translateY(-50%); }

/* ── Línea divisoria central ── */
.divider {
  position: absolute; top: 50%; left: 0;
  width: 100%; height: 2px;
  transform: translateY(-50%);
  background: #000;
  box-shadow: 0 0 6px rgba(0,0,0,1);
  z-index: 10;
  pointer-events: none;
  transition: opacity 0.3s;
}

/* ── Brillo de bisel superior ── */
.card::before {
  content: '';
  position: absolute; top: 0; left: 0;
  width: 100%; height: 1px;
  background: rgba(255,255,255,0.06);
  z-index: 12;
  pointer-events: none;
  transition: opacity 0.3s;
}

/* ── Badge AM/PM ── */
.ampm {
  position: absolute;
  top: clamp(4px,0.8vmin,8px); left: clamp(5px,1vmin,10px);
  font-size: clamp(8px,1vmin,11px);
  font-weight: 700; letter-spacing: 0.1em;
  color: #3a3a3a; text-transform: uppercase;
  font-family: Arial, sans-serif;
  z-index: 11; pointer-events: none;
  transition: opacity 0.3s;
}

/* ── Mode Label ── */
.mode-label {
  font-size: clamp(8px, 1.1vmin, 11px);
  font-weight: 700;
  letter-spacing: 0.22em;
  color: #333;
  text-transform: uppercase;
  font-family: Arial, sans-serif;
  text-align: center;
  height: 13px;
  transition: opacity 0.4s;
}

/* ── Controls bar ── */
.controls-bar {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: clamp(6px, 1.5vmin, 14px);
  margin-top: clamp(2px, 0.8vmin, 6px);
  transition: opacity 0.5s ease;
}

.ctrl-btn {
  background: none;
  border: none;
  cursor: pointer;
  padding: clamp(4px, 0.9vmin, 7px);
  border-radius: 5px;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0.28;
  transition: opacity 0.2s, background 0.2s;
  color: #fff;
}
.ctrl-btn:hover { opacity: 0.65; background: rgba(255,255,255,0.05); }
.ctrl-btn.active { opacity: 0.85; }
.ctrl-btn svg { display: block; }

/* ── Auto-hide controls (idle state) ── */
body.idle .controls-bar,
body.idle .mode-label {
  opacity: 0;
  pointer-events: none;
}

/* ── Timer/Stopwatch/Pomodoro action buttons ── */
.action-bar {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: clamp(8px, 1.8vmin, 16px);
  height: 0;
  overflow: hidden;
  opacity: 0;
  transition: height 0.35s ease, opacity 0.3s ease, margin-top 0.35s ease;
  margin-top: 0;
}
.action-bar.visible {
  height: clamp(28px, 5vmin, 40px);
  opacity: 1;
  margin-top: clamp(2px, 0.8vmin, 4px);
}
body.idle .action-bar { opacity: 0; pointer-events: none; }

.act-btn {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.09);
  color: #888;
  font-size: clamp(9px, 1.1vmin, 11px);
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  font-family: Arial, sans-serif;
  padding: clamp(4px,0.8vmin,6px) clamp(10px,2vmin,16px);
  border-radius: 4px;
  cursor: pointer;
  transition: background 0.2s, color 0.2s, border-color 0.2s;
}
.act-btn:hover { background: rgba(255,255,255,0.11); color: #ccc; border-color: rgba(255,255,255,0.18); }
.act-btn.primary { color: #ddd; background: rgba(255,255,255,0.11); border-color: rgba(255,255,255,0.2); }
.act-btn.primary:hover { background: rgba(255,255,255,0.18); color: #fff; }

/* ── Timer setup overlay ── */
.timer-setup {
  display: none;
  flex-direction: column;
  align-items: center;
  gap: clamp(10px, 2vmin, 16px);
  position: fixed;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  background: #161616;
  border: 1px solid #222;
  border-radius: 14px;
  justify-content: center;
  z-index: 200;
  padding: clamp(20px, 4vmin, 32px) clamp(24px, 5vmin, 40px);
  box-shadow: 0 30px 80px rgba(0,0,0,0.85), 0 6px 18px rgba(0,0,0,0.7);
  min-width: 300px;
}
.timer-setup.visible { display: flex; }
.timer-setup-title {
  font-size: clamp(9px, 1.1vmin, 11px);
  font-weight: 700;
  letter-spacing: 0.2em;
  color: #444;
  text-transform: uppercase;
  font-family: Arial, sans-serif;
}
.timer-inputs {
  display: flex;
  align-items: center;
  gap: clamp(6px, 1.2vmin, 12px);
}
.timer-input-group {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
}
.timer-input-group label {
  font-size: clamp(8px, 0.9vmin, 10px);
  color: #3a3a3a;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  font-family: Arial, sans-serif;
}
.timer-input-group input {
  width: clamp(52px, 10vmin, 76px);
  height: clamp(44px, 8vmin, 62px);
  background: #0e0e0e;
  border: 1px solid #2a2a2a;
  border-radius: 6px;
  color: #fff;
  font-size: clamp(22px, 4.5vmin, 36px);
  font-weight: 900;
  font-family: 'Arial Black', Arial, sans-serif;
  text-align: center;
  outline: none;
  transition: border-color 0.2s;
  -moz-appearance: textfield;
}
.timer-input-group input::-webkit-inner-spin-button,
.timer-input-group input::-webkit-outer-spin-button { -webkit-appearance: none; }
.timer-input-group input:focus { border-color: #444; }
.timer-sep-dot {
  font-size: clamp(20px, 4vmin, 32px);
  font-weight: 900;
  color: #2a2a2a;
  margin-bottom: 18px;
  font-family: 'Arial Black', Arial, sans-serif;
}
.timer-setup-btns {
  display: flex;
  gap: clamp(8px, 1.5vmin, 14px);
}

/* ── Quick presets ── */
.preset-row {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: clamp(5px, 1vmin, 8px);
  max-width: 320px;
}
.preset-btn {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.08);
  color: #777;
  font-size: clamp(9px, 1vmin, 11px);
  font-weight: 700;
  letter-spacing: 0.08em;
  font-family: Arial, sans-serif;
  padding: clamp(4px,0.7vmin,6px) clamp(9px,1.6vmin,13px);
  border-radius: 4px;
  cursor: pointer;
  transition: background 0.2s, color 0.2s, border-color 0.2s;
}
.preset-btn:hover { background: rgba(255,255,255,0.1); color: #ddd; border-color: rgba(255,255,255,0.18); }
.preset-btn.active { background: rgba(255,255,255,0.14); color: #fff; border-color: rgba(255,255,255,0.22); }

/* ── Finish flash ── */
@keyframes flashCard {
  0%,100% { box-shadow: 0 30px 80px rgba(0,0,0,0.8), 0 6px 18px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.05); }
  50%     { box-shadow: 0 30px 80px rgba(255,255,255,0.08), 0 6px 18px rgba(255,255,255,0.05), inset 0 1px 0 rgba(255,255,255,0.18); }
}
.card.flash { animation: flashCard 0.55s ease 3; }

/* ── Settings panel ── */
.settings-panel {
  display: none;
  flex-direction: column;
  gap: 14px;
  position: fixed;
  bottom: 28px; right: 28px;
  background: #161616;
  border: 1px solid #222;
  border-radius: 12px;
  padding: 18px 22px;
  z-index: 150;
  min-width: 240px;
  box-shadow: 0 16px 48px rgba(0,0,0,0.85), 0 4px 14px rgba(0,0,0,0.6);
  max-height: 80vh;
  overflow-y: auto;
}
.settings-panel.visible { display: flex; }
.settings-title {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.2em;
  color: #444;
  text-transform: uppercase;
  font-family: Arial, sans-serif;
}
.settings-row {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.settings-row label {
  font-size: 10px;
  color: #555;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.settings-row label span {
  color: #777;
  font-size: 10px;
  letter-spacing: 0;
  font-weight: 700;
}
/* Slider */
.scale-slider {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 2px;
  background: #2a2a2a;
  border-radius: 1px;
  outline: none;
  cursor: pointer;
}
.scale-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 14px; height: 14px;
  border-radius: 50%;
  background: #aaa;
  cursor: pointer;
  transition: background 0.2s;
  box-shadow: 0 1px 4px rgba(0,0,0,0.8);
}
.scale-slider::-webkit-slider-thumb:hover { background: #ddd; }
.scale-slider::-moz-range-thumb {
  width: 14px; height: 14px;
  border-radius: 50%;
  background: #aaa;
  cursor: pointer;
  border: none;
  box-shadow: 0 1px 4px rgba(0,0,0,0.8);
}

/* Segmented controls */
.seg-row {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.seg-btn {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.08);
  color: #666;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.08em;
  font-family: Arial, sans-serif;
  padding: 5px 10px;
  border-radius: 4px;
  cursor: pointer;
  transition: background 0.2s, color 0.2s, border-color 0.2s;
  flex: 1;
  min-width: 0;
  text-align: center;
}
.seg-btn:hover { background: rgba(255,255,255,0.1); color: #ccc; }
.seg-btn.active { background: rgba(255,255,255,0.16); color: #fff; border-color: rgba(255,255,255,0.25); }

/* ─────────────────────────────────────────────
   CLOCK STYLE VARIANTS
   ───────────────────────────────────────────── */

/* Airport — narrow, fast, panel-board */
#shell[data-style="airport"] .digit {
  font-family: 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
  letter-spacing: -0.07em;
  font-weight: 800;
}
#shell[data-style="airport"] .card {
  border-radius: clamp(2px, 0.3vmin, 4px);
  box-shadow:
    0 20px 60px rgba(0,0,0,0.75),
    0 4px 12px rgba(0,0,0,0.65),
    inset 0 1px 0 rgba(255,255,255,0.04);
}
#shell[data-style="airport"] .half.up,
#shell[data-style="airport"] .flap-wrap.up .flap {
  background: linear-gradient(180deg, #1c1c1c, #131313);
}
#shell[data-style="airport"] .half.down,
#shell[data-style="airport"] .flap-wrap.down .flap {
  background: linear-gradient(180deg, #0a0a0a, #161616);
}

/* Mechanical — heavy, deep, industrial */
#shell[data-style="mechanical"] .card {
  background: #0a0a0a;
  border-radius: clamp(4px, 0.6vmin, 10px);
  box-shadow:
    0 40px 100px rgba(0,0,0,0.95),
    0 12px 32px rgba(0,0,0,0.9),
    inset 0 1px 0 rgba(255,255,255,0.08),
    inset 0 -3px 6px rgba(0,0,0,0.85);
}
#shell[data-style="mechanical"] .half.up,
#shell[data-style="mechanical"] .flap-wrap.up .flap {
  background: linear-gradient(180deg, #1d1d1d, #0a0a0a);
}
#shell[data-style="mechanical"] .half.down,
#shell[data-style="mechanical"] .flap-wrap.down .flap {
  background: linear-gradient(180deg, #060606, #161616);
}
#shell[data-style="mechanical"] .digit {
  text-shadow:
    0 1px 0 rgba(255,255,255,0.05),
    0 3px 6px rgba(0,0,0,0.9),
    0 12px 24px rgba(0,0,0,0.7);
}
#shell[data-style="mechanical"] .divider {
  box-shadow: 0 0 10px rgba(0,0,0,1);
  height: 3px;
}

/* Ultra Minimal — no cards, numbers floating */
#shell[data-style="ultra"] .card {
  background: transparent;
  box-shadow: none;
  border-radius: 0;
}
#shell[data-style="ultra"] .half,
#shell[data-style="ultra"] .flap-wrap .flap {
  background: transparent !important;
}
#shell[data-style="ultra"] .divider { opacity: 0; }
#shell[data-style="ultra"] .card::before { opacity: 0; }
#shell[data-style="ultra"] .digit {
  text-shadow:
    0 2px 6px rgba(0,0,0,0.9),
    0 12px 30px rgba(0,0,0,0.6);
}

/* ── Fullscreen / screensaver mode ── */
:fullscreen body,
:-webkit-full-screen body,
:-moz-full-screen body {
  background: #000 !important;
}
body.fs-mode .controls-bar,
body.fs-mode .mode-label,
body.fs-mode .action-bar,
body.fs-mode .settings-panel {
  display: none !important;
}
</style>
</head>
<body>

<!-- Timer setup (fixed overlay, outside shell) -->
<div class="timer-setup" id="timerSetup">
  <div class="timer-setup-title">Configurar Temporizador</div>
  <div class="timer-inputs">
    <div class="timer-input-group">
      <input type="number" id="inputH" min="0" max="23" value="0">
      <label>horas</label>
    </div>
    <div class="timer-sep-dot">:</div>
    <div class="timer-input-group">
      <input type="number" id="inputM" min="0" max="59" value="5">
      <label>min</label>
    </div>
    <div class="timer-sep-dot">:</div>
    <div class="timer-input-group">
      <input type="number" id="inputS" min="0" max="59" value="0">
      <label>seg</label>
    </div>
  </div>
  <div class="preset-row" id="presetRow">
    <button class="preset-btn" data-sec="60">1 min</button>
    <button class="preset-btn" data-sec="300">5 min</button>
    <button class="preset-btn" data-sec="600">10 min</button>
    <button class="preset-btn" data-sec="1500">25 min</button>
    <button class="preset-btn" data-sec="1800">30 min</button>
    <button class="preset-btn" data-sec="2700">45 min</button>
    <button class="preset-btn" data-sec="3600">60 min</button>
  </div>
  <div class="timer-setup-btns">
    <button class="act-btn" id="setupCancelBtn">Cancelar</button>
    <button class="act-btn primary" id="setupStartBtn">Iniciar</button>
  </div>
</div>

<!-- Settings panel -->
<div class="settings-panel" id="settingsPanel">
  <div class="settings-title">Configuración</div>

  <div class="settings-row">
    <label>Tamaño <span id="scaleLabel">100%</span></label>
    <input type="range" class="scale-slider" id="scaleSlider" min="60" max="200" value="100" step="5">
  </div>

  <div class="settings-row">
    <label>Estilo</label>
    <div class="seg-row" id="styleRow">
      <button class="seg-btn" data-val="classic">Classic</button>
      <button class="seg-btn" data-val="airport">Airport</button>
      <button class="seg-btn" data-val="mechanical">Mech</button>
      <button class="seg-btn" data-val="ultra">Ultra</button>
    </div>
  </div>

  <div class="settings-row">
    <label>Velocidad Flip</label>
    <div class="seg-row" id="speedRow">
      <button class="seg-btn" data-val="slow">Lenta</button>
      <button class="seg-btn" data-val="normal">Normal</button>
      <button class="seg-btn" data-val="fast">Rápida</button>
    </div>
  </div>

  <div class="settings-row">
    <label>Mostrar segundos</label>
    <div class="seg-row" id="secondsRow">
      <button class="seg-btn" data-val="on">ON</button>
      <button class="seg-btn" data-val="off">OFF</button>
    </div>
  </div>

  <div class="settings-row">
    <label>Sonidos</label>
    <div class="seg-row" id="soundsRow">
      <button class="seg-btn" data-val="on">ON</button>
      <button class="seg-btn" data-val="off">OFF</button>
    </div>
  </div>

  <div class="settings-row">
    <label>Formato</label>
    <div class="seg-row" id="formatRow">
      <button class="seg-btn" data-val="12">12h</button>
      <button class="seg-btn" data-val="24">24h</button>
    </div>
  </div>
</div>

<!-- Entry animation wrapper -->
<div class="entry-wrap">
<!-- Main clock shell (no background/border) -->

<script>
// ─────────────────────────────────────────────
// SETTINGS (persisted)
// ─────────────────────────────────────────────
const DEFAULT_SETTINGS = {
  scale: 100,
  style: 'classic',
  flipSpeed: 'normal',     // slow | normal | fast
  showSeconds: false,
  sounds: true,
  format24: false,
};
let settings = { ...DEFAULT_SETTINGS };

function loadSettings() {
  try {
    const raw = localStorage.getItem('flipclock_settings');
    if (raw) settings = { ...DEFAULT_SETTINGS, ...JSON.parse(raw) };
  } catch(e) {}
}
function saveSettings() {
  try { localStorage.setItem('flipclock_settings', JSON.stringify(settings)); } catch(e) {}
}

// ─────────────────────────────────────────────
// FLIP ANIMATION CONSTANTS
// ─────────────────────────────────────────────
const GAP_MS = 10;
const EASE_UP   = 'cubic-bezier(0.55, 0.055, 0.675, 0.19)';  // gravity pull
const EASE_DOWN = 'cubic-bezier(0.215, 0.61, 0.355, 1)';     // inertial settle

const STYLE_SPEED_MULT = { classic: 1, airport: 0.8, mechanical: 1.15, ultra: 1 };
const FLIP_SPEED_MULT  = { slow: 1.4, normal: 1.0, fast: 0.62 };

function totalSpeedMult() {
  return FLIP_SPEED_MULT[settings.flipSpeed] * STYLE_SPEED_MULT[settings.style];
}
// Random base 210-260ms, scaled by current speed multipliers
function flipDuration() {
  const base = 210 + Math.random() * 50;
  return Math.round(base * totalSpeedMult());
}

// ─────────────────────────────────────────────
// SLOT FACTORY
// ─────────────────────────────────────────────
function makeSlot(id) {
  return {
    id,
    staticUp:    document.querySelector(`#su-${id} .digit`),
    staticDown:  document.querySelector(`#sd-${id} .digit`),
    castShade:   document.getElementById(`cs-${id}`),
    flapUp:      document.getElementById(`fu-${id}`),
    flapDown:    document.getElementById(`fd-${id}`),
    flapUpNum:   document.querySelector(`#fu-${id} .digit`),
    flapDownNum: document.querySelector(`#fd-${id} .digit`),
    shadeUp:     document.getElementById(`fs-fu-${id}`),
    shadeDown:   document.getElementById(`fs-fd-${id}`),
    current: null,
    busy: false,
  };
}

const S = ['s0','s1','s2','s3','s4','s5'].map(makeSlot);

// ─────────────────────────────────────────────
// IMMEDIATE SET (no animation)
// ─────────────────────────────────────────────
function setImmediate(slot, val) {
  const v = String(val);
  slot.flapUp.getAnimations().forEach(a => a.cancel());
  slot.flapDown.getAnimations().forEach(a => a.cancel());
  slot.shadeUp.getAnimations().forEach(a => a.cancel());
  slot.shadeDown.getAnimations().forEach(a => a.cancel());
  slot.castShade.getAnimations().forEach(a => a.cancel());

  slot.staticUp.textContent    = v;
  slot.staticDown.textContent  = v;
  slot.flapUpNum.textContent   = v;
  slot.flapDownNum.textContent = v;
  slot.flapUp.style.transform    = 'rotateX(0deg)';
  slot.flapDown.style.transform  = 'rotateX(0deg)';
  slot.shadeUp.style.background  = 'transparent';
  slot.shadeDown.style.background = 'transparent';
  slot.castShade.style.background = 'transparent';
  slot.current = v;
  slot.busy    = false;
}

// ─────────────────────────────────────────────
// MECHANICAL FLIP ANIMATION
// ─────────────────────────────────────────────
function flip(slot, newVal) {
  if (slot.busy || slot.current === String(newVal)) return;
  slot.busy = true;

  const oldVal = slot.current ?? '0';
  const nv     = String(newVal);

  const durUp   = flipDuration();
  const durDown = flipDuration();

  slot.staticDown.textContent  = nv;
  slot.flapUpNum.textContent   = oldVal;
  slot.flapDownNum.textContent = nv;

  slot.flapUp.style.transform   = 'rotateX(0deg)';
  slot.flapDown.style.transform = 'rotateX(90deg)';
  slot.shadeUp.style.background   = 'transparent';
  slot.shadeDown.style.background = 'rgba(0,0,0,0.65)';
  slot.castShade.style.background = 'transparent';

  // ── Phase 1: upper flap falls (0° → -90°) ──
  const animUp = slot.flapUp.animate(
    [
      { transform: 'rotateX(0deg)',   easing: EASE_UP },
      { transform: 'rotateX(-90deg)' }
    ],
    { duration: durUp, fill: 'forwards' }
  );

  // Shadow on the upper flap itself (intensifies near 90deg)
  slot.shadeUp.animate(
    [
      { background: 'rgba(0,0,0,0)',    offset: 0,   easing: 'ease-in' },
      { background: 'rgba(0,0,0,0.35)', offset: 0.6, easing: 'ease-in' },
      { background: 'rgba(0,0,0,0.85)', offset: 1 }
    ],
    { duration: durUp, fill: 'forwards' }
  );

  // Dynamic cast shadow projected onto the lower static half,
  // grows as the upper flap approaches 90deg, then fades during phase 2
  slot.castShade.animate(
    [
      { background: 'rgba(0,0,0,0)',     offset: 0,   easing: 'ease-in' },
      { background: 'rgba(0,0,0,0.45)',  offset: 0.7, easing: 'ease-in' },
      { background: 'rgba(0,0,0,0.6)',   offset: 1 }
    ],
    { duration: durUp, fill: 'forwards' }
  );

  animUp.onfinish = () => {
    slot.staticUp.textContent = nv;
    slot.flapUp.getAnimations().forEach(a => a.cancel());
    slot.flapUp.style.transform = 'rotateX(-90deg)';
    slot.shadeUp.getAnimations().forEach(a => a.cancel());
    slot.shadeUp.style.background = 'transparent';

    // ── Phase 2: lower flap swings out (90° → 0°) after brief pause ──
    setTimeout(() => {
      const animDown = slot.flapDown.animate(
        [
          { transform: 'rotateX(90deg)', easing: EASE_DOWN },
          { transform: 'rotateX(0deg)' }
        ],
        { duration: durDown, fill: 'forwards' }
      );

      // Cast shadow fades out as lower flap settles into place
      slot.castShade.animate(
        [
          { background: 'rgba(0,0,0,0.6)', easing: 'ease-out' },
          { background: 'rgba(0,0,0,0)' }
        ],
        { duration: durDown, fill: 'forwards' }
      );

      slot.shadeDown.animate(
        [
          { background: 'rgba(0,0,0,0.65)', easing: 'ease-out' },
          { background: 'rgba(0,0,0,0)' }
        ],
        { duration: durDown, fill: 'forwards' }
      );

      animDown.onfinish = () => {
        slot.flapUpNum.textContent   = nv;
        slot.flapDownNum.textContent = nv;
        slot.flapUp.getAnimations().forEach(a => a.cancel());
        slot.flapDown.getAnimations().forEach(a => a.cancel());
        slot.shadeUp.getAnimations().forEach(a => a.cancel());
        slot.shadeDown.getAnimations().forEach(a => a.cancel());
        slot.castShade.getAnimations().forEach(a => a.cancel());
        slot.flapUp.style.transform    = 'rotateX(0deg)';
        slot.flapDown.style.transform  = 'rotateX(0deg)';
        slot.shadeUp.style.background  = 'transparent';
        slot.shadeDown.style.background = 'transparent';
        slot.castShade.style.background = 'transparent';

        // ── Mechanical bounce: 0° → 3° → 0°, max 80ms ──
        const bounce = slot.flapDown.animate(
          [
            { transform: 'rotateX(0deg)' },
            { transform: 'rotateX(3deg)', offset: 0.5 },
            { transform: 'rotateX(0deg)' }
          ],
          { duration: 80, easing: 'ease-out', fill: 'none' }
        );
        bounce.onfinish = () => {
          slot.flapDown.style.transform = 'rotateX(0deg)';
          slot.current = nv;
          slot.busy    = false;
        };
        bounce.oncancel = () => {
          slot.current = nv;
          slot.busy    = false;
        };
      };
    }, GAP_MS);
  };
}

function renderDigits(digits, animate) {
  digits.forEach((d, i) => {
    if (animate) flip(S[i], d);
    else         setImmediate(S[i], d);
  });
}

// ─────────────────────────────────────────────
// UI REFERENCES
// ─────────────────────────────────────────────
const ampmEl         = document.getElementById('ampm');
const modeLabel      = document.getElementById('modeLabel');
const actionBar      = document.getElementById('actionBar');
const actionMainBtn  = document.getElementById('actionMainBtn');
const actionSkipBtn  = document.getElementById('actionSkipBtn');
const actionResetBtn = document.getElementById('actionResetBtn');
const sep1           = document.getElementById('sep1');
const sep2           = document.getElementById('sep2');
const timerSetup     = document.getElementById('timerSetup');
const setupStartBtn  = document.getElementById('setupStartBtn');
const setupCancelBtn = document.getElementById('setupCancelBtn');
const inputH         = document.getElementById('inputH');
const inputM         = document.getElementById('inputM');
const inputS         = document.getElementById('inputS');
const presetRow      = document.getElementById('presetRow');
const pair2          = document.getElementById('pair-2');
const shell          = document.getElementById('shell');
const settingsPanel  = document.getElementById('settingsPanel');
const scaleSlider    = document.getElementById('scaleSlider');
const scaleLabel     = document.getElementById('scaleLabel');

// ─────────────────────────────────────────────
// SCALE
// ─────────────────────────────────────────────
function applyScale(val) {
  const s = val / 100;
  shell.style.setProperty('--clock-scale', s);
  if (!document.body.classList.contains('fs-mode')) {
    shell.style.transform = `scale(${s})`;
  }
  scaleLabel.textContent = val + '%';
}

scaleSlider.addEventListener('input', () => {
  const v = parseInt(scaleSlider.value);
  settings.scale = v;
  applyScale(v);
  saveSettings();
});

// ─────────────────────────────────────────────
// SEGMENTED CONTROL BINDER
// ─────────────────────────────────────────────
function bindSegRow(rowId, currentVal, onChange) {
  const row = document.getElementById(rowId);
  const btns = row.querySelectorAll('.seg-btn');
  btns.forEach(b => {
    b.classList.toggle('active', b.dataset.val === String(currentVal));
    b.addEventListener('click', () => {
      btns.forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      onChange(b.dataset.val);
      saveSettings();
    });
  });
}

// ─────────────────────────────────────────────
// SETTINGS PANEL TOGGLE
// ─────────────────────────────────────────────
document.getElementById('btnSettings').addEventListener('click', (e) => {
  e.stopPropagation();
  settingsPanel.classList.toggle('visible');
  document.getElementById('btnSettings').classList.toggle('active', settingsPanel.classList.contains('visible'));
});

document.addEventListener('click', (e) => {
  if (!settingsPanel.contains(e.target) && e.target !== document.getElementById('btnSettings')) {
    settingsPanel.classList.remove('visible');
    document.getElementById('btnSettings').classList.remove('active');
  }
});

// ─────────────────────────────────────────────
// MODE STATE
// ─────────────────────────────────────────────
// 'clock' | 'timer' | 'stopwatch' | 'pomodoro'
let mode = 'clock';

// ─────────────────────────────────────────────
// CLOCK MODE
// ─────────────────────────────────────────────
let clockTimeout = null;

function clockDigits() {
  const now  = new Date();
  let h      = now.getHours();
  const m    = now.getMinutes();
  const sec  = now.getSeconds();
  const isPM = h >= 12;

  if (!settings.format24) {
    h = h % 12 || 12;
    ampmEl.textContent = isPM ? 'PM' : 'AM';
  }

  return [
    Math.floor(h / 10), h % 10,
    Math.floor(m / 10), m % 10,
    Math.floor(sec / 10), sec % 10,
  ];
}

function scheduleClock() {
  clearTimeout(clockTimeout);
  if (settings.showSeconds) {
    clockTimeout = setTimeout(() => {
      if (mode !== 'clock') return;
      renderDigits(clockDigits(), true);
      scheduleClock();
    }, 1000 - (Date.now() % 1000));
  } else {
    clockTimeout = setTimeout(() => {
      if (mode !== 'clock') return;
      renderDigits(clockDigits(), true);
      scheduleClock();
    }, 60000 - (Date.now() % 60000));
  }
}

function startClock(animate) {
  pair2.style.display  = settings.showSeconds ? '' : 'none';
  sep2.style.display   = settings.showSeconds ? '' : 'none';
  ampmEl.style.display = settings.format24 ? 'none' : '';
  const d = clockDigits();
  renderDigits(settings.showSeconds ? d : [d[0],d[1],d[2],d[3],0,0], animate);
  scheduleClock();
}

// ─────────────────────────────────────────────
// STOPWATCH MODE
// ─────────────────────────────────────────────
let swElapsed  = 0;
let swStart    = null;
let swInterval = null;
let swRunning  = false;

function swDigits() {
  const total = Math.floor(swElapsed / 1000);
  const hh = Math.floor(total / 3600);
  const mm = Math.floor((total % 3600) / 60);
  const ss = total % 60;
  return [Math.floor(hh/10), hh%10, Math.floor(mm/10), mm%10, Math.floor(ss/10), ss%10];
}

function swTick() {
  if (swStart !== null) swElapsed = Date.now() - swStart;
  renderDigits(swDigits(), true);
}

function startStopwatch(fresh) {
  if (fresh) { swElapsed = 0; swStart = null; swRunning = false; }
  pair2.style.display  = '';
  sep2.style.display   = '';
  ampmEl.style.display = 'none';
  sep1.classList.remove('blinking');
  renderDigits(swDigits(), false);
  actionMainBtn.textContent  = 'Iniciar';
  actionResetBtn.textContent = 'Reiniciar';
  actionSkipBtn.style.display = 'none';
  actionBar.classList.add('visible');
}

function swRun() {
  swStart = Date.now() - swElapsed;
  swRunning = true;
  clearInterval(swInterval);
  swInterval = setInterval(swTick, 250);
  sep1.classList.add('blinking');
  actionMainBtn.textContent = 'Pausar';
}

function swPause() {
  clearInterval(swInterval);
  swElapsed = Date.now() - swStart;
  swStart = null; swRunning = false;
  sep1.classList.remove('blinking');
  actionMainBtn.textContent = 'Reanudar';
}

function swReset() {
  clearInterval(swInterval);
  swElapsed = 0; swStart = null; swRunning = false;
  sep1.classList.remove('blinking');
  renderDigits([0,0,0,0,0,0], true);
  actionMainBtn.textContent = 'Iniciar';
}

// ─────────────────────────────────────────────
// SHARED: digits-from-seconds + finish flash + beep
// ─────────────────────────────────────────────
function secsToDigits(secs) {
  const hh = Math.floor(secs / 3600);
  const mm = Math.floor((secs % 3600) / 60);
  const ss = secs % 60;
  return [Math.floor(hh/10), hh%10, Math.floor(mm/10), mm%10, Math.floor(ss/10), ss%10];
}

function flashCards() {
  document.querySelectorAll('.card').forEach(c => {
    c.classList.remove('flash');
    void c.offsetWidth;
    c.classList.add('flash');
  });
  setTimeout(() => document.querySelectorAll('.card').forEach(c => c.classList.remove('flash')), 1800);
}

let audioCtx = null;
function beep() {
  if (!settings.sounds) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const t = audioCtx.currentTime;
    [0, 0.22, 0.44].forEach((offset, i) => {
      const osc  = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(i === 0 ? 880 : i === 1 ? 1100 : 660, t + offset);
      gain.gain.setValueAtTime(0, t + offset);
      gain.gain.linearRampToValueAtTime(0.12, t + offset + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, t + offset + 0.18);
      osc.start(t + offset);
      osc.stop(t + offset + 0.2);
    });
  } catch(e) {}
}

// ─────────────────────────────────────────────
// TIMER MODE
// ─────────────────────────────────────────────
let tmTotal    = 0;
let tmRemain   = 0;
let tmStart    = null;
let tmInterval = null;
let tmRunning  = false;
let tmFinished = false;

function tmFinish() {
  clearInterval(tmInterval);
  tmRunning = false; tmFinished = true;
  sep1.classList.remove('blinking');
  renderDigits([0,0,0,0,0,0], true);
  flashCards();
  beep();
  actionMainBtn.textContent  = 'Reiniciar';
  actionResetBtn.textContent = 'Reiniciar';
}

function tmTick() {
  if (tmStart === null) return;
  const elapsed = Math.floor((Date.now() - tmStart) / 1000);
  const rem = Math.max(0, tmRemain - elapsed);
  renderDigits(secsToDigits(rem), true);
  if (rem === 0) tmFinish();
}

function startTimer(h, m, s) {
  tmTotal   = h * 3600 + m * 60 + s;
  tmRemain  = tmTotal;
  tmStart   = null; tmRunning = false; tmFinished = false;
  pair2.style.display  = '';
  sep2.style.display   = '';
  ampmEl.style.display = 'none';
  sep1.classList.remove('blinking');
  renderDigits(secsToDigits(tmRemain), false);
  actionMainBtn.textContent  = 'Iniciar';
  actionResetBtn.textContent = 'Reiniciar';
  actionSkipBtn.style.display = 'none';
  actionBar.classList.add('visible');
}

function tmRun() {
  if (tmFinished || tmRemain === 0) return;
  const alreadyElapsed = tmTotal - tmRemain;
  tmStart = Date.now() - alreadyElapsed * 1000;
  tmRunning = true;
  clearInterval(tmInterval);
  tmInterval = setInterval(tmTick, 250);
  sep1.classList.add('blinking');
  actionMainBtn.textContent = 'Pausar';
}

function tmPause() {
  if (!tmRunning) return;
  const elapsed = Math.floor((Date.now() - tmStart) / 1000);
  tmRemain = Math.max(0, tmRemain - elapsed);
  tmStart  = null;
  clearInterval(tmInterval);
  tmRunning = false;
  sep1.classList.remove('blinking');
  actionMainBtn.textContent = 'Reanudar';
}

function tmReset() {
  clearInterval(tmInterval);
  tmStart = null; tmRunning = false; tmFinished = false;
  tmRemain = tmTotal;
  sep1.classList.remove('blinking');
  renderDigits(secsToDigits(tmRemain), true);
  actionMainBtn.textContent  = 'Iniciar';
}

// ─────────────────────────────────────────────
// POMODORO MODE
// ─────────────────────────────────────────────
const POMO_DURATIONS = { focus: 25*60, short: 5*60, long: 15*60 };
const POMO_LABELS    = { focus: 'FOCUS', short: 'BREAK', long: 'LONG BREAK' };

let pmPhase    = 'focus';
let pmCount    = 0;     // completed focus sessions
let pmRemain   = POMO_DURATIONS.focus;
let pmStart    = null;
let pmInterval = null;
let pmRunning  = false;

function pmSetPhaseDisplay() {
  modeLabel.textContent = POMO_LABELS[pmPhase];
  renderDigits(secsToDigits(pmRemain), false);
}

function startPomodoro() {
  pmPhase  = 'focus';
  pmCount  = 0;
  pmRemain = POMO_DURATIONS.focus;
  pmStart  = null; pmRunning = false;
  pair2.style.display  = '';
  sep2.style.display   = '';
  ampmEl.style.display = 'none';
  sep1.classList.remove('blinking');
  pmSetPhaseDisplay();
  actionMainBtn.textContent  = 'Iniciar';
  actionResetBtn.textContent = 'Reiniciar';
  actionSkipBtn.style.display = '';
  actionSkipBtn.textContent = 'Saltar';
  actionBar.classList.add('visible');
}

function pmAdvancePhase() {
  if (pmPhase === 'focus') {
    pmCount++;
    pmPhase = (pmCount % 4 === 0) ? 'long' : 'short';
  } else {
    pmPhase = 'focus';
  }
  pmRemain = POMO_DURATIONS[pmPhase];
  pmStart = null; pmRunning = false;
  clearInterval(pmInterval);
  sep1.classList.remove('blinking');
  pmSetPhaseDisplay();
  actionMainBtn.textContent = 'Iniciar';
}

function pmFinish() {
  clearInterval(pmInterval);
  pmRunning = false;
  sep1.classList.remove('blinking');
  renderDigits([0,0,0,0,0,0], true);
  flashCards();
  beep();
  setTimeout(() => pmAdvancePhase(), 600);
}

function pmTick() {
  if (pmStart === null) return;
  const elapsed = Math.floor((Date.now() - pmStart) / 1000);
  const total = POMO_DURATIONS[pmPhase];
  const rem = Math.max(0, total - elapsed);
  pmRemain = rem;
  renderDigits(secsToDigits(rem), true);
  if (rem === 0) pmFinish();
}

function pmRun() {
  if (pmRemain === 0) return;
  const alreadyElapsed = POMO_DURATIONS[pmPhase] - pmRemain;
  pmStart = Date.now() - alreadyElapsed * 1000;
  pmRunning = true;
  clearInterval(pmInterval);
  pmInterval = setInterval(pmTick, 250);
  sep1.classList.add('blinking');
  actionMainBtn.textContent = 'Pausar';
}

function pmPause() {
  if (!pmRunning) return;
  const elapsed = Math.floor((Date.now() - pmStart) / 1000);
  pmRemain = Math.max(0, POMO_DURATIONS[pmPhase] - elapsed);
  pmStart = null;
  clearInterval(pmInterval);
  pmRunning = false;
  sep1.classList.remove('blinking');
  actionMainBtn.textContent = 'Reanudar';
}

function pmReset() {
  clearInterval(pmInterval);
  pmStart = null; pmRunning = false;
  pmRemain = POMO_DURATIONS[pmPhase];
  sep1.classList.remove('blinking');
  renderDigits(secsToDigits(pmRemain), true);
  actionMainBtn.textContent = 'Iniciar';
}

// ─────────────────────────────────────────────
// MODE SWITCHING
// ─────────────────────────────────────────────
function stopAll() {
  clearTimeout(clockTimeout); clockTimeout = null;
  clearInterval(swInterval);  swInterval   = null;
  clearInterval(tmInterval);  tmInterval   = null;
  clearInterval(pmInterval);  pmInterval   = null;
  sep1.classList.remove('blinking');
  swRunning = false; tmRunning = false; pmRunning = false;
}

function setMode(m) {
  stopAll();
  mode = m;
  document.querySelectorAll('.ctrl-btn').forEach(b => b.classList.remove('active'));
  actionBar.classList.remove('visible');
  timerSetup.classList.remove('visible');

  if (m === 'clock') {
    document.getElementById('btnClock').classList.add('active');
    modeLabel.textContent = 'RELOJ';
    startClock(true);
  } else if (m === 'timer') {
    document.getElementById('btnTimer').classList.add('active');
    modeLabel.textContent = 'TEMPORIZADOR';
    pair2.style.display  = '';
    sep2.style.display   = '';
    ampmEl.style.display = 'none';
    renderDigits(secsToDigits(tmRemain || 0), false);
    timerSetup.classList.add('visible');
  } else if (m === 'stopwatch') {
    document.getElementById('btnStopwatch').classList.add('active');
    modeLabel.textContent = 'CRONÓMETRO';
    startStopwatch(true);
  } else if (m === 'pomodoro') {
    document.getElementById('btnPomodoro').classList.add('active');
    startPomodoro();
  }
}

// ─────────────────────────────────────────────
// ACTION BUTTONS
// ─────────────────────────────────────────────
actionMainBtn.addEventListener('click', () => {
  if (mode === 'stopwatch') {
    if (!swRunning) swRun(); else swPause();
  } else if (mode === 'timer') {
    if (tmFinished) { tmReset(); return; }
    if (!tmRunning) tmRun(); else tmPause();
  } else if (mode === 'pomodoro') {
    if (!pmRunning) pmRun(); else pmPause();
  }
});

actionSkipBtn.addEventListener('click', () => {
  if (mode === 'pomodoro') pmAdvancePhase();
});

actionResetBtn.addEventListener('click', () => {
  if (mode === 'stopwatch') swReset();
  else if (mode === 'timer') tmReset();
  else if (mode === 'pomodoro') pmReset();
});

// ─────────────────────────────────────────────
// TIMER SETUP
// ─────────────────────────────────────────────
setupStartBtn.addEventListener('click', () => {
  const h = Math.max(0, Math.min(23, parseInt(inputH.value) || 0));
  const m = Math.max(0, Math.min(59, parseInt(inputM.value) || 0));
  const s = Math.max(0, Math.min(59, parseInt(inputS.value) || 0));
  if (h + m + s === 0) return;
  timerSetup.classList.remove('visible');
  startTimer(h, m, s);
});

setupCancelBtn.addEventListener('click', () => {
  timerSetup.classList.remove('visible');
  setMode('clock');
});

[inputH, inputM, inputS].forEach(inp => {
  inp.addEventListener('input', () => {
    const max = inp === inputH ? 23 : 59;
    let v = parseInt(inp.value);
    if (isNaN(v) || v < 0) inp.value = 0;
    if (v > max) inp.value = max;
    presetRow.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
  });
  inp.addEventListener('focus', () => inp.select());
});

// ── Quick presets ──
presetRow.querySelectorAll('.preset-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    presetRow.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const sec = parseInt(btn.dataset.sec);
    inputH.value = Math.floor(sec / 3600);
    inputM.value = Math.floor((sec % 3600) / 60);
    inputS.value = sec % 60;
  });
});

// ─────────────────────────────────────────────
// MODE BUTTONS
// ─────────────────────────────────────────────
document.getElementById('btnClock').addEventListener('click', () => setMode('clock'));
document.getElementById('btnTimer').addEventListener('click', () => setMode('timer'));
document.getElementById('btnStopwatch').addEventListener('click', () => setMode('stopwatch'));
document.getElementById('btnPomodoro').addEventListener('click', () => setMode('pomodoro'));

// ─────────────────────────────────────────────
// FULLSCREEN / SCREENSAVER MODE
// ─────────────────────────────────────────────
const fsIcon    = document.getElementById('fsIcon');
const FS_EXPAND = `<path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"/>`;
const FS_SHRINK = `<path d="M8 3v3a2 2 0 0 1-2 2H3M21 8h-3a2 2 0 0 1-2-2V3M3 16h3a2 2 0 0 0 2 2v3M16 21v-3a2 2 0 0 0 2-2h3"/>`;

document.getElementById('btnFullscreen').addEventListener('click', () => {
  const fs = document.fullscreenElement || document.webkitFullscreenElement;
  if (!fs) {
    (document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen || function(){}).call(document.documentElement);
  } else {
    (document.exitFullscreen || document.webkitExitFullscreen || function(){}).call(document);
  }
});

function fitFullscreenScale() {
  const prevTransform = shell.style.transform;
  shell.style.transform = 'none';
  // Force reflow before measuring
  void shell.offsetWidth;
  const rect = shell.getBoundingClientRect();
  const scaleX = (window.innerWidth  * 0.9) / rect.width;
  const scaleY = (window.innerHeight * 0.9) / rect.height;
  const fsScale = Math.min(scaleX, scaleY);
  shell.style.transform = `scale(${fsScale})`;
}

function updateFsIcon() {
  const fs = document.fullscreenElement || document.webkitFullscreenElement;
  fsIcon.innerHTML = fs ? FS_SHRINK : FS_EXPAND;
  if (fs) {
    document.body.classList.add('fs-mode');
    document.body.style.background = '#000';
    requestAnimationFrame(fitFullscreenScale);
  } else {
    document.body.classList.remove('fs-mode');
    document.body.style.background = '';
    applyScale(settings.scale);
  }
}
document.addEventListener('fullscreenchange', updateFsIcon);
document.addEventListener('webkitfullscreenchange', updateFsIcon);
window.addEventListener('resize', () => {
  if (document.body.classList.contains('fs-mode')) fitFullscreenScale();
});

// ─────────────────────────────────────────────
// AUTO-HIDE CONTROLS (idle state)
// ─────────────────────────────────────────────
let idleTimer = null;
function resetIdle() {
  document.body.classList.remove('idle');
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    if (!settingsPanel.classList.contains('visible') && !timerSetup.classList.contains('visible')) {
      document.body.classList.add('idle');
    }
  }, 3000);
}
['mousemove', 'touchstart', 'click', 'keydown'].forEach(ev =>
  document.addEventListener(ev, resetIdle, { passive: true })
);

// ─────────────────────────────────────────────
// BOOT
// ─────────────────────────────────────────────
loadSettings();
applyScale(settings.scale);
scaleSlider.value = settings.scale;
shell.dataset.style = settings.style;

bindSegRow('styleRow', settings.style, (v) => {
  settings.style = v;
  shell.dataset.style = v;
});
bindSegRow('speedRow', settings.flipSpeed, (v) => {
  settings.flipSpeed = v;
});
bindSegRow('secondsRow', settings.showSeconds ? 'on' : 'off', (v) => {
  settings.showSeconds = (v === 'on');
  if (mode === 'clock') startClock(false);
});
bindSegRow('soundsRow', settings.sounds ? 'on' : 'off', (v) => {
  settings.sounds = (v === 'on');
});
bindSegRow('formatRow', settings.format24 ? '24' : '12', (v) => {
  settings.format24 = (v === '24');
  if (mode === 'clock') startClock(false);
});

setMode('clock');
resetIdle();
</script>
